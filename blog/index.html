<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muskan Hashim — Blog</title>
  <meta name="author" content="Muskan Hashim" />
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #999999;
      --rule: #e8e8e8;
      --hover: #fafafa;
      --accent: #e0218a;
      --serif: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      padding: 56px 32px 96px;
      -webkit-font-smoothing: antialiased;
    }

    .page { width: 100%; }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding-bottom: 12px;
      margin-bottom: 52px;
      border-bottom: 1px solid var(--ink);
    }

    .elsewhere {
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
    }

    .elsewhere:hover { color: var(--accent); }

    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    ::selection { background: var(--accent); color: #ffffff; }

    /* switching between the two views */

    .views {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 44px;
      font-size: 0.85rem;
    }

    .views button {
      font: inherit;
      font-family: var(--serif);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      color: var(--muted);
    }

    .views button:hover { color: var(--accent); }
    .views button[aria-pressed="true"] { color: var(--ink); }
    .views button:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
    .views .sep { color: var(--rule); }

    /* sits apart from the switch: it does something, it does not choose a view */
    .views .pick {
      margin-left: auto;
      color: var(--ink);
    }

    .views .pick:hover { color: var(--accent); }

    /* the wall */

    .wall {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      /* the cloud is the only thing on the page in this view, so its lines
         spread down the whole of it rather than bunching at the top */
      align-content: space-evenly;
      min-height: max(300px, calc(100vh - 400px));
      gap: 12px 28px;
      text-align: center;
    }

    .wall a {
      color: var(--ink);
      text-decoration: none;
      line-height: 1.2;
      transition: color 140ms ease, opacity 220ms ease;
    }

    .wall a:hover { color: var(--accent); }

    /* look at one and the rest step back */
    .wall:hover a { opacity: 0.4; }
    .wall a:hover { opacity: 1; }

    /* a piece you have already read stays pink -- :visited is the only part of
       browser history CSS may style, and only ever as a colour */
    .wall a:visited,
    .wall a.read { color: var(--accent); }

    .wall .d {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 8px;
      opacity: 0;
      transition: opacity 140ms ease;
    }

    .wall a:hover .d { opacity: 1; }

    .note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 26px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    [hidden] { display: none !important; }

    /* the tiles */

    .tiles { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }

    .row { display: flex; gap: 1px; }
    .stack { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .stack > a { flex: 1; }

    .tiles a {
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      padding: 12px 16px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      transition: background 140ms ease;
    }

    .tiles a:hover { background: var(--hover); }
    .tiles a:hover .t { color: var(--accent); }
    .tiles a:visited,
    .tiles a.read { color: var(--accent); }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .d { font-size: 0.7rem; color: var(--muted); }

    .num { font-size: 0.7rem; color: var(--muted); }

    .wall .num {
      font-size: 0.5em;
      margin-right: 5px;
      top: -0.6em;
      color: var(--muted);
    }

    .tiles a:hover .num { color: var(--accent); }

    .t { margin-top: auto; line-height: 1.16; overflow-wrap: break-word; transition: color 140ms ease; }

    /* the list of what you have already opened, set the way this index
       used to look: title left, date right, a hairline between */
    .read-view { max-width: none; }

    .columns {
      display: flex;
      flex-wrap: wrap;
      gap: 56px;
      align-items: flex-start;
    }

    .column { flex: 1 1 380px; max-width: 560px; }

    .column h2 {
      font-size: 0.85rem;
      font-weight: normal;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .column.unread a { color: var(--ink); }

    .read-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .read-view ul { list-style: none; }

    .read-view li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      padding: 11px 0;
      border-bottom: 1px solid var(--rule);
    }

    .read-view li:first-child { border-top: 1px solid var(--rule); }
    .read-view a { color: var(--accent); text-decoration: none; }
    .read-view a:hover { text-decoration: underline; }
    .read-view .d { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

    .forget {
      margin-top: 32px;
      font-family: var(--serif);
      font-size: 0.78rem;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .forget:hover { color: var(--accent); }
    .forget:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    .back {
      display: block;
      margin-top: 72px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    @media (max-width: 760px) {
      body { padding: 40px 18px 72px; }
      .note { white-space: normal; }
      .wall { min-height: 0; align-content: flex-start; gap: 14px 22px; }
      .row { flex-wrap: wrap; height: auto !important; }
      .row > * { flex: 1 1 46% !important; min-height: 112px; }
    }

    @media (max-width: 440px) {
      .row > * { flex: 1 1 100% !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    /* 117 */
    .mark {
      position: fixed;
      right: 20px;
      bottom: 22px;
      text-align: center;
      line-height: 1.04;
      user-select: none;
    }

    .mark i {
      display: block;
      font-style: normal;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      color: #b7b7b7;
      transition: color 400ms ease;
    }

    .mark:hover i { color: #e0218a; }
  </style>
</head>
<body>

  <div class="page">

    <div class="head">
      <h1>blog</h1>
      <a class="elsewhere" href="/photos/">photo gallery &rarr;</a>
    </div>

    <div class="views">
      <button type="button" data-view="wall" aria-pressed="true">word cloud</button>
      <span class="sep">/</span>
      <button type="button" data-view="tiles" aria-pressed="false">tiles</button>
      <span class="sep">/</span>
      <button type="button" data-view="read" aria-pressed="false">what you've read</button>
      <button type="button" class="pick" id="pick">pick one for me</button>
    </div>

    <div class="wall" id="wall"></div>

    <p class="note" id="note" hidden>same blog entries, in tile form, in case the chaotic word cloud triggers you</p>

    <div class="tiles" id="tiles" hidden></div>

    <div class="read-view" id="read" hidden></div>

    <a class="back" href="/">&larr; back</a>

  </div>

<script>
  (function () {
    var POSTS = [
      { n:  1, t: "nobody\u2019s daughter",                             d: "sep 2020", u: "nobodys-daughter.html" },
      { n:  2, t: "learning to live with your (sins) self",             d: "jul 2022", u: "live-with-yourself.html" },
      { n:  3, t: "train station human",                                d: "aug 2025", u: "train-station-human.html" },
      { n:  4, t: "thoughts from the er",                               d: "sep 2025", u: "thoughts-from-the-er.html" },
      { n:  5, t: "to a dead version of myself",                        d: "feb 2026", u: "to-a-dead-version-of-myself.html" },
      { n:  6, t: "dear german dad,",                                   d: "may 2026", u: "dear-german-dad.html" },
      { n:  7, t: "is it a privilege to be principled",                 d: "jun 2026", u: "is-it-a-privilege-to-be-principled.html" },
      { n:  8, t: "on why we deserve privacy and personal freedoms",    d: "jun 2026", u: "on-why-we-deserve-privacy-and-personal-freedoms.html" },
      { n:  9, t: "on ai-free will.",                                   d: "jul 2026", u: "free-will.html" },
      { n: 10, t: "the night we met",                                   d: "aug 2026", u: "the-night-we-met.html" },
      { n: 11, t: "beautiful things",                                   d: "aug 2026", u: "beautiful-things.html" },
      { n: 12, t: "random stuff",                                       d: "oct 2026", u: "random-stuff.html" },
      { n: 13, t: "the only thing i have is myself",                    d: "oct 2026", u: "the-only-thing.html" },
      { n: 14, t: "fight me.",                                          d: "oct 2026", u: "fight-me.html" },
      { n: 15, t: "the most important thing you can learn in life?",    d: "",         u: "most-imp.html" }
    ];

    // :visited handles this natively, but browsers now partition it and clear it
    // with history, so keep our own note of what has been opened from here
    var READ_KEY = "read-posts";

    function readSet() {
      try { return JSON.parse(localStorage.getItem(READ_KEY)) || []; }
      catch (e) { return []; }
    }

    var READ = readSet();

    function markRead(u) {
      if (READ.indexOf(u) !== -1) return;
      READ.push(u);
      try { localStorage.setItem(READ_KEY, JSON.stringify(READ)); } catch (e) {}
    }

    function postLink(p) {
      var a = document.createElement("a");
      a.href = p.u;
      if (READ.indexOf(p.u) !== -1) a.className = "read";
      a.addEventListener("click", function () { markRead(p.u); });
      return a;
    }

    function rnd(a, b) { return a + Math.random() * (b - a); }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

    function shuffled(list) {
      var a = list.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    // a title only gets a size it can carry in the cell it landed in
    function titleSize(title, width, height) {
      var n = title.length;
      var size = Math.round(Math.min(44, Math.max(16, height * rnd(0.26, 0.40))));
      var room = Math.max(1, (width - 34) * (height - 42));
      while (size > 14 && n * size * size * 0.46 > room) size -= 1;
      return size;
    }

    function tile(p, width, height) {
      var a = postLink(p);
      var meta = el("span", "meta");
      meta.appendChild(el("span", "num", ("0" + p.n).slice(-2)));
      if (p.d) meta.appendChild(el("span", "d", p.d));
      a.appendChild(meta);
      var t = el("span", "t", p.t);
      t.style.fontSize = titleSize(p.t, width, height) + "px";
      a.appendChild(t);
      return a;
    }

    function renderTiles() {
      var host = document.getElementById("tiles");
      host.textContent = "";
      var full = host.clientWidth || 1084;
      // the cloud is the one that shuffles; this view is the one you come
      // back to, so it holds a steady order -- newest first
      var queue = POSTS.slice().reverse();

      while (queue.length) {
        // a single leftover joins the row above rather than starting a bare one
        if (queue.length === 1 && host.lastChild) {
          var prev = host.lastChild;
          var tall = parseInt(prev.style.height, 10) || 170;
          var solo = tile(queue.shift(), Math.round(full * 0.3), tall);
          solo.style.flex = rnd(1, 2.3) + " 1 0";
          prev.appendChild(solo);
          break;
        }

        // cells in this row, and how tall the row is: both drawn fresh each time
        // cells follow the real width, so a wide screen gets more per row
        // instead of a few very wide tiles with air in them
        var target = rnd(290, 430);
        var cells = queue.length <= 2 ? queue.length
                  : Math.max(2, Math.min(queue.length, 6, Math.round(full / target)));
        var height = Math.round(rnd(96, 172));
        var row = el("div", "row");
        row.style.height = height + "px";

        var weights = [], i;
        for (i = 0; i < cells; i++) weights.push(rnd(1, 2.3));
        var sum = weights.reduce(function (x, y) { return x + y; }, 0);

        for (i = 0; i < cells && queue.length; i++) {
          var w = Math.round(full * weights[i] / sum);
          // stacking eats two posts, so only do it while every later cell still has one
          var stack = cells <= 3 && height > 148 && queue.length >= cells - i + 1 && Math.random() < 0.38;

          if (stack) {
            var box = el("div", "stack");
            box.style.flex = weights[i] + " 1 0";
            box.appendChild(tile(queue.shift(), w, height / 2));
            box.appendChild(tile(queue.shift(), w, height / 2));
            row.appendChild(box);
          } else {
            var a = tile(queue.shift(), w, height);
            a.style.flex = weights[i] + " 1 0";
            row.appendChild(a);
          }
        }

        host.appendChild(row);
      }

      shrinkToFit(host);
    }

    // the estimate above is only a guess: measure each tile and step the type
    // down until the title actually fits, so nothing is ever cut off
    function shrinkToFit(host) {
      Array.prototype.forEach.call(host.querySelectorAll("a"), function (a) {
        var t = a.querySelector(".t");
        var size = parseFloat(t.style.fontSize);
        var guard = 0;
        while (a.scrollHeight > a.clientHeight + 1 && size > 12 && guard++ < 40) {
          size -= 1;
          t.style.fontSize = size + "px";
        }
      });
    }

    function renderWall() {
      var host = document.getElementById("wall");
      host.textContent = "";
      // every visit, one of them shouts
      var loud = POSTS[Math.floor(Math.random() * POSTS.length)];
      shuffled(POSTS).forEach(function (p) {
        var a = postLink(p);
        a.appendChild(el("sup", "num", ("0" + p.n).slice(-2)));
        a.appendChild(document.createTextNode(p.t));
        if (p.d) a.appendChild(el("span", "d", p.d));
        var n = p.t.length;
        var sizes = n <= 14 ? [24, 30, 37] : n <= 24 ? [21, 25, 31] : n <= 34 ? [18, 22, 26] : [17, 20, 23];
        a.style.fontSize = pick(sizes) + "px";
        if (p === loud) a.style.fontSize = Math.round(parseFloat(a.style.fontSize) * 2.1) + "px";
        host.appendChild(a);
      });
    }

    renderWall();

    // one view at a time, and the choice is remembered
    var VIEW_KEY = "view";
    var wall = document.getElementById("wall");
    var tiles = document.getElementById("tiles");
    var read = document.getElementById("read");
    var note = document.getElementById("note");
    var buttons = document.querySelectorAll(".views button[data-view]");
    var tilesDrawn = false;

    function renderRead() {
      var host = document.getElementById("read");
      host.textContent = "";

      var seen = READ.map(function (u) {
        for (var i = 0; i < POSTS.length; i++) if (POSTS[i].u === u) return POSTS[i];
        return null;
      }).filter(Boolean);

      var unseen = POSTS.filter(function (p) { return READ.indexOf(p.u) === -1; })
                        .slice().reverse();   // newest of what is left, first

      host.appendChild(el("p", "read-count", seen.length
        ? "you have opened " + seen.length + " of " + POSTS.length
        : "you have not opened any of them yet. the ones you have read show in pink."));

      function column(title, posts, cls, empty) {
        var box = el("div", "column " + cls);
        box.appendChild(el("h2", null, title));
        if (!posts.length) {
          box.appendChild(el("p", "read-count", empty));
          return box;
        }
        var ul = document.createElement("ul");
        posts.forEach(function (p) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = p.u;
          a.textContent = ("0" + p.n).slice(-2) + "  " + p.t;
          a.addEventListener("click", function () { markRead(p.u); });
          li.appendChild(a);
          li.appendChild(el("span", "d", p.d || ""));
          ul.appendChild(li);
        });
        box.appendChild(ul);
        return box;
      }

      var cols = el("div", "columns");
      cols.appendChild(column("read, in the order you read them", seen, "seen",
                              "nothing yet"));
      cols.appendChild(column("not yet", unseen, "unread",
                              "nothing left. you have read all of them."));
      host.appendChild(cols);

      if (seen.length) {
        var forget = el("button", "forget", "forget what i have read");
        forget.type = "button";
        forget.addEventListener("click", function () {
          READ.length = 0;
          try { localStorage.removeItem(READ_KEY); } catch (e) {}
          renderRead(); renderWall(); if (!tiles.hidden) renderTiles();
        });
        host.appendChild(forget);
      }
    }

    function show(view) {
      var isTiles = view === "tiles";
      var isRead = view === "read";
      wall.hidden = isTiles || isRead;
      tiles.hidden = note.hidden = !isTiles;
      read.hidden = !isRead;
      if (isRead) renderRead();
      Array.prototype.forEach.call(buttons, function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-view") === view));
      });
      // the tile rows are measured against the container, so they can only be
      // laid out once the container is actually on the page
      if (isTiles) { renderTiles(); tilesDrawn = true; }
      try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
    }

    Array.prototype.forEach.call(buttons, function (b) {
      b.addEventListener("click", function () { show(b.getAttribute("data-view")); });
    });

    // hands you something you have not read, unless you have read everything
    document.getElementById("pick").addEventListener("click", function () {
      var pool = POSTS.filter(function (p) { return READ.indexOf(p.u) === -1; });
      if (!pool.length) pool = POSTS;
      var p = pool[Math.floor(Math.random() * pool.length)];
      markRead(p.u);
      location.href = p.u;
    });

    var saved;
    try { saved = localStorage.getItem(VIEW_KEY); } catch (e) {}
    if (saved === "tiles" || saved === "read") show(saved);

    window.addEventListener("resize", function () {
      if (!tiles.hidden) renderTiles();
    });
  })();
</script>

  <span class="mark" aria-hidden="true"><i>1</i><i>1</i><i>7</i></span>
</body>
</html>
