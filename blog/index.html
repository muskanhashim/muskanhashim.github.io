<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muskan Hashim — Blog</title>
  <meta name="author" content="Muskan Hashim" />
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #999999;
      --rule: #e8e8e8;
      --hover: #fafafa;
      --accent: #c2527c;
      --serif: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      padding: 80px 24px 96px;
      -webkit-font-smoothing: antialiased;
    }

    .page { max-width: 1140px; margin: 0 auto; }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
    }

    .elsewhere {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 64px;
    }

    .elsewhere:hover { color: var(--accent); }

    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    /* the wall */

    .wall { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 28px; }

    .wall a {
      color: var(--ink);
      text-decoration: none;
      line-height: 1.2;
      transition: color 140ms ease;
    }

    .wall a:hover { color: var(--accent); }

    .wall .d {
      font-size: 0.7rem;
      color: var(--muted);
      margin-left: 8px;
      opacity: 0;
      transition: opacity 140ms ease;
    }

    .wall a:hover .d { opacity: 1; }

    .seam { height: 1px; background: var(--rule); margin: 96px 0 40px; }

    /* the tiles */

    .tiles { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }

    .row { display: flex; gap: 1px; }
    .stack { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .stack > a { flex: 1; }

    .tiles a {
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      padding: 14px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
      transition: background 140ms ease;
    }

    .tiles a:hover { background: var(--hover); }
    .tiles a:hover .t { color: var(--accent); }

    .d { font-size: 0.7rem; color: var(--muted); }

    .t { margin-top: auto; line-height: 1.16; overflow-wrap: break-word; transition: color 140ms ease; }

    .back {
      display: block;
      margin-top: 72px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    @media (max-width: 760px) {
      body { padding: 48px 18px 72px; }
      .seam { margin: 56px 0 28px; }
      .row { flex-wrap: wrap; height: auto !important; }
      .row > * { flex: 1 1 46% !important; min-height: 132px; }
    }

    @media (max-width: 440px) {
      .row > * { flex: 1 1 100% !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="page">

    <h1>blog</h1>

    <a class="elsewhere" href="/photos/">photos &rarr;</a>

    <div class="wall" id="wall"></div>

    <div class="seam"></div>

    <div class="tiles" id="tiles"></div>

    <a class="back" href="/">&larr; back</a>

  </div>

<script>
  (function () {
    var POSTS = [
      { t: "nobody\u2019s daughter",                             d: "sep 2020", u: "nobodys-daughter.html" },
      { t: "learning to live with your (sins) self",             d: "jul 2022", u: "live-with-yourself.html" },
      { t: "train station human",                                d: "aug 2025", u: "train-station-human.html" },
      { t: "thoughts from the er",                               d: "sep 2025", u: "thoughts-from-the-er.html" },
      { t: "to a dead version of myself",                        d: "feb 2026", u: "to-a-dead-version-of-myself.html" },
      { t: "dear german dad,",                                   d: "may 2026", u: "dear-german-dad.html" },
      { t: "is it a privilege to be principled",                 d: "jun 2026", u: "is-it-a-privilege-to-be-principled.html" },
      { t: "on why we deserve privacy and personal freedoms",    d: "jun 2026", u: "on-why-we-deserve-privacy-and-personal-freedoms.html" },
      { t: "On \u201Cmoving\u201D through life, intentionally.",  d: "jul 2026", u: "moving-with-intention.html" },
      { t: "on ai-free will.",                                   d: "jul 2026", u: "free-will.html" },
      { t: "the night we met",                                   d: "aug 2026", u: "the-night-we-met.html" },
      { t: "beautiful things",                                   d: "aug 2026", u: "beautiful-things.html" },
      { t: "random stuff",                                       d: "oct 2026", u: "random-stuff.html" },
      { t: "the only thing i have is myself",                    d: "oct 2026", u: "the-only-thing.html" },
      { t: "fight me.",                                          d: "oct 2026", u: "fight-me.html" },
      { t: "the most important thing you can learn in life?",    d: "",         u: "most-imp.html" }
    ];

    function rnd(a, b) { return a + Math.random() * (b - a); }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

    function shuffled(list) {
      var a = list.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    // a title only gets a size it can carry in the cell it landed in
    function titleSize(title, width, height) {
      var n = title.length;
      var sizes = n <= 14 ? [20, 25, 31] : n <= 24 ? [17, 21, 26] : n <= 34 ? [16, 19, 23] : [15, 17, 20];
      var size = pick(sizes);
      var room = Math.max(1, (width - 38) * (height - 56));
      while (size > 14 && n * size * size * 0.46 > room) size -= 1;
      return size;
    }

    function tile(p, width, height) {
      var a = document.createElement("a");
      a.href = p.u;
      if (p.d) a.appendChild(el("span", "d", p.d));
      var t = el("span", "t", p.t);
      t.style.fontSize = titleSize(p.t, width, height) + "px";
      a.appendChild(t);
      return a;
    }

    function renderTiles() {
      var host = document.getElementById("tiles");
      host.textContent = "";
      var full = host.clientWidth || 1084;
      var queue = shuffled(POSTS);

      while (queue.length) {
        // a single leftover joins the row above rather than starting a bare one
        if (queue.length === 1 && host.lastChild) {
          var prev = host.lastChild;
          var tall = parseInt(prev.style.height, 10) || 170;
          var solo = tile(queue.shift(), Math.round(full * 0.3), tall);
          solo.style.flex = rnd(1, 2.3) + " 1 0";
          prev.appendChild(solo);
          break;
        }

        // cells in this row, and how tall the row is: both drawn fresh each time
        var cells = queue.length <= 2 ? queue.length : Math.min(queue.length, 2 + Math.floor(Math.random() * 3));
        var height = Math.round(rnd(140, 236));
        var row = el("div", "row");
        row.style.height = height + "px";

        var weights = [], i;
        for (i = 0; i < cells; i++) weights.push(rnd(1, 2.3));
        var sum = weights.reduce(function (x, y) { return x + y; }, 0);

        for (i = 0; i < cells && queue.length; i++) {
          var w = Math.round(full * weights[i] / sum);
          // stacking eats two posts, so only do it while every later cell still has one
          var stack = cells <= 3 && height > 176 && queue.length >= cells - i + 1 && Math.random() < 0.38;

          if (stack) {
            var box = el("div", "stack");
            box.style.flex = weights[i] + " 1 0";
            box.appendChild(tile(queue.shift(), w, height / 2));
            box.appendChild(tile(queue.shift(), w, height / 2));
            row.appendChild(box);
          } else {
            var a = tile(queue.shift(), w, height);
            a.style.flex = weights[i] + " 1 0";
            row.appendChild(a);
          }
        }

        host.appendChild(row);
      }
    }

    function renderWall() {
      var host = document.getElementById("wall");
      host.textContent = "";
      shuffled(POSTS).forEach(function (p) {
        var a = document.createElement("a");
        a.href = p.u;
        a.appendChild(document.createTextNode(p.t));
        if (p.d) a.appendChild(el("span", "d", p.d));
        var n = p.t.length;
        var sizes = n <= 14 ? [24, 30, 37] : n <= 24 ? [21, 25, 31] : n <= 34 ? [18, 22, 26] : [17, 20, 23];
        a.style.fontSize = pick(sizes) + "px";
        host.appendChild(a);
      });
    }

    renderWall();
    renderTiles();
  })();
</script>

</body>
</html>
