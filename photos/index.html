  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #999999;
      --rule: #e8e8e8;
      --accent: #e0218a;
      --serif: Georgia, "Times New Roman", serif;
      --gap: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      padding: 56px var(--gap) 96px;
      -webkit-font-smoothing: antialiased;
    }

    /* The pictures run to the edges: the margin left and right is the same
       as the gap between them, so there is no white frame around the wall.
       Rows hold their height because they carry more frames, not because
       the wall is narrow. */
    .page { width: 100%; max-width: 1600px; margin: 0 auto; }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding-bottom: 12px;
      margin-bottom: 52px;
      border-bottom: 1px solid var(--ink);
    }

    .elsewhere {
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
    }

    .elsewhere:hover { color: var(--accent); }

    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    ::selection { background: var(--accent); color: #ffffff; }

    /* Justified rows: every picture in a row shares a height, and the row
       fills the column. Each frame's flex-grow is its aspect ratio, so the
       height solves itself and holds at any width. Which pictures share a
       row is the whole composition — the rows are set by hand. */
    .rows { display: flex; flex-direction: column; gap: var(--gap); }

    /* --sum is the row's total aspect, so this holds the row no taller than
       part of the window however short the window is. A row that would be
       taller than that sits in from the edges instead of growing. */
    .row {
      display: flex;
      align-items: flex-start;
      gap: var(--gap);
      max-width: calc(68vh * var(--sum, 3) + var(--gap) * var(--gaps, 0));
      margin: 0 auto;
    }

    .row img {
      min-width: 0;
      flex-basis: 0;
      width: 100%;
      height: auto;
      display: block;
      background: var(--rule);
      transition: opacity 260ms ease;
    }

    @media (hover: hover) {
      .rows:hover img { opacity: 0.38; }
      .row img:hover { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .row img { transition: none; }
    }

    /* the way out and the 117, on one line under the wall */
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 64px;
    }

    .back {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    /* Below the width the rows were composed for, a row of five is five
       slivers. The rows break into pairs, then into one picture at a time. */
    @media (min-width: 621px) and (max-width: 900px) {
      .row { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      /* an odd row would otherwise leave a hole beside its last picture */
      .row img:last-child:nth-child(odd) { grid-column: span 2; }
    }

    @media (max-width: 620px) {
      :root { --gap: 10px; }
      body { padding: 40px var(--gap) 72px; }
      .head { margin-bottom: 36px; }
      .row { flex-direction: column; }
    }

    /* 117 stands in the page here rather than fixed in a corner -- with the
       pictures running to the edges, a fixed corner is always on top of one
       of them. */
    .mark {
      text-align: center;
      line-height: 1.04;
      user-select: none;
    }

    .mark a { text-decoration: none; }

    .mark i {
      display: block;
      font-style: normal;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      color: #9a9a9a;
      transition: color 400ms ease;
    }

    .mark a:hover i { color: #e0218a; }
  </style>
