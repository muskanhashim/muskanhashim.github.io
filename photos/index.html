  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #999999;
      --rule: #e8e8e8;
      --accent: #e0218a;
      --serif: Georgia, "Times New Roman", serif;
      --h: 240;
      --scale: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--ink);
      padding: 56px 32px 96px;
      -webkit-font-smoothing: antialiased;
    }

    .page { width: 100%; }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding-bottom: 12px;
      margin-bottom: 52px;
      border-bottom: 1px solid var(--ink);
    }

    .elsewhere {
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
    }

    .elsewhere:hover { color: var(--accent); }

    a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    ::selection { background: var(--accent); color: #ffffff; }

    .strip {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }

    .strip img {
      height: calc(var(--h) * var(--scale) * 1px);
      width: auto;
      display: block;
      background: var(--rule);
      transition: opacity 260ms ease;
    }

    @media (hover: hover) {
      .strip:hover img { opacity: 0.38; }
      .strip img:hover { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .strip img { transition: none; }
    }

    .back {
      display: block;
      margin-top: 72px;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    @media (max-width: 1140px) { :root { --scale: 0.78; } }
    @media (max-width: 860px)  { :root { --scale: 0.58; } }

    @media (max-width: 620px) {
      body { padding: 40px 18px 72px; }
      .head { margin-bottom: 36px; }
      .strip { gap: 10px; }
      .strip img { height: auto; width: calc(50% - 5px); }
    }

    /* 117 */
    .mark {
      position: fixed;
      right: 14px;
      bottom: 18px;
      text-align: center;
      line-height: 1.15;
    }

    .mark i {
      display: block;
      font-style: normal;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.62rem;
      letter-spacing: 0.34em;
      color: #c9c9c9;
      user-select: none;
      transition: color 400ms ease;
    }

    .mark:hover { color: #e0218a; }
  </style>
